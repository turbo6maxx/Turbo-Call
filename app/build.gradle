plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.softdial.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.softdial.app'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Do not run llvm-strip (the NDK's x86 binary cannot run on an ARM phone host).
            keepDebugSymbols += ['**/*.so']
            // Linphone and PJSIP both ship the C++ runtime; keep one copy.
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'

    // Server 1: Linphone SDK
    implementation 'org.linphone:linphone-sdk-android:5.3.105'

    // Server 2: PJSIP / PJSUA2
    implementation files('libs/pjsua2-release.aar')
}
